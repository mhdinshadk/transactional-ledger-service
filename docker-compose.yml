version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: ledger-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: ledger-app
    depends_on:
      - mongo
    env_file:
      - .env
    ports:
      - "4000:4000"

volumes:
  mongo-data:
